<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Become a distribution partner | People &amp; Perspectives</title><link rel="icon" href="/favicon.png"><link rel="stylesheet" href="/app.css"><style>.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 22px}.tabs button{background:#151515;color:#fff;border:2px solid #2a2a2a;border-radius:99px;padding:9px 20px;font-weight:800;cursor:pointer;text-transform:uppercase;font-size:13px}.tabs button.on{background:var(--y);color:#000;border-color:var(--y)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0}.row input,.row select{width:auto}.sc{overflow-x:auto}.login{max-width:420px;margin:8vh auto}.hp{position:absolute;left:-9999px}</style></head><body><div class="top"><a href="/"><img src="/logo.png" alt=""></a><a class="b" href="/">← Back to site</a></div><div class="wrap" id="app"><h1 style="margin:0;font-size:clamp(40px,8vw,64px)">Become a distribution partner</h1><p class="muted" style="font-size:18px">Paps, influencers, clippers, media channels, YouTubers and podcasters: help our episodes reach more people. Tell us about your reach and we will review your application.</p>
<form id="f" class="card"><input class="hp" id="hp" tabindex="-1" autocomplete="off">
<label>I am a (choose all that apply) *</label><div id="types"></div>
<div class="grid g2"><div><label>Your name or channel name *</label><input id="name" required></div><div><label>Brand / channel (if different)</label><input id="channel"></div><div><label>Email *</label><input id="email" type="email" required></div><div><label>Phone *</label><input id="phone" type="tel" required></div><div><label>City *</label><input id="city" required></div><div><label>Audience size</label><input id="audience" placeholder="e.g. 120K followers, 2M monthly views"></div></div>
<label>Platforms</label><input id="platforms" placeholder="YouTube, Instagram, X, podcast apps...">
<label>Links to your channels or profiles * (one per line, https://)</label><textarea id="links" rows="3"></textarea>
<label>Tell us how you would distribute our content</label><textarea id="about" rows="3"></textarea>
<label style="display:flex;gap:10px;align-items:flex-start;text-transform:none;font-weight:500"><input type="checkbox" id="consent" style="width:auto;margin-top:4px"> I confirm the details are correct and agree that People &amp; Perspectives may contact me.</label>
<div class="err" id="er"></div><button class="btn" id="go" type="submit">Submit application</button></form></div>
<script src="/dash.js"></script><script>
const {$,api}=D;const T=['Paps','Influencer','Clipper','Media channel','YouTuber','Podcaster','Other'];$('#types').innerHTML=T.map(t=>`<span class="chip" data-t="${t}">${t}</span>`).join('');document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>c.classList.toggle('on'));
$('#f').onsubmit=async e=>{e.preventDefault();const er=$('#er');er.textContent='';$('#go').disabled=true;
const b={kind:'distribution',hp:$('#hp').value,consent:$('#consent').checked,types:[...document.querySelectorAll('.chip.on')].map(c=>c.dataset.t),links:$('#links').value.split(/\s+/).filter(Boolean)};for(const k of['name','channel','email','phone','city','audience','platforms','about'])b[k]=$('#'+k).value;
const r=await api('/apply',b);if(!r.ok){er.textContent=r.j.error||'Something went wrong.';$('#go').disabled=false;return}
$('#app').innerHTML='<div class="card" style="margin-top:40px"><h1 style="margin:0 0 10px">Application received</h1><p style="font-size:18px">Thank you. Our team will review it and get back to you. Your reference is <b>'+D.esc(r.j.ref)+'</b>.</p><a class="btn" href="/">Back to site</a></div>'}
</script></body></html>
