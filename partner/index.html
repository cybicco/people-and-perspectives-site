<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Partner dashboard | People &amp; Perspectives</title><link rel="icon" href="/favicon.png"><link rel="stylesheet" href="/app.css"><style>.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 22px}.tabs button{background:#151515;color:#fff;border:2px solid #2a2a2a;border-radius:99px;padding:9px 20px;font-weight:800;cursor:pointer;text-transform:uppercase;font-size:13px}.tabs button.on{background:var(--y);color:#000;border-color:var(--y)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0}.row input,.row select{width:auto}.sc{overflow-x:auto}.login{max-width:420px;margin:8vh auto}.hp{position:absolute;left:-9999px}</style></head><body><div class="top"><a href="/"><img src="/logo.png" alt=""></a><span id="who" class="muted"></span></div><div class="wrap" id="app"></div><script src="/dash.js"></script><script>
const {$,esc,api}=D;
D.start('partner','Partner dashboard',async()=>{await load()});
async function load(){const r=await api('/partner/dashboard');const d=r.j,p=d.profile||{};
$('#app').innerHTML=`<h1 style="margin:0;font-size:44px">Welcome${p.name?', '+esc(p.name):''}</h1><p class="muted">${esc((p.types||[]).join(' · '))}</p>
<h2 style="margin:24px 0 8px">Content to distribute</h2>${d.assets.map(a=>`<div class="card" style="margin-bottom:12px"><b style="font-size:18px">${esc(a.title)}</b><div class="muted">${esc(a.notes||'')}</div><div class="row"><a class="btn sm" href="${esc(a.url)}" target="_blank" rel="noopener">Open content</a></div><div class="row"><input data-u="${a.id}" placeholder="Link to your post (https://)" style="flex:1;min-width:200px"><input data-n="${a.id}" placeholder="Note (optional)" style="flex:1;min-width:140px"><button class="btn sm ghost" data-p="${a.id}">Report post</button></div></div>`).join('')||'<div class="card muted">No content has been shared with you yet. The team will add it here.</div>'}
<h2 style="margin:24px 0 8px">Your reported posts</h2><div class="card sc"><table><tr><th>Content</th><th>Your post</th><th>When</th></tr>${d.posts.map(x=>`<tr><td>${esc(x.title||'')}</td><td><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.url)}</a><br><span class="muted">${esc(x.note||'')}</span></td><td>${esc(x.created_at)}</td></tr>`).join('')||'<tr><td colspan=3 class="muted">Nothing reported yet.</td></tr>'}</table></div>`;
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=async()=>{const id=b.dataset.p;const x=await api('/partner/post',{asset_id:id,url:document.querySelector(`[data-u="${id}"]`).value,note:document.querySelector(`[data-n="${id}"]`).value});x.ok?load():alert(x.j.error)})}
</script></body></html>
