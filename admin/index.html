<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Admin | People &amp; Perspectives</title><link rel="icon" href="/favicon.png"><link rel="stylesheet" href="/app.css">
<style>.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 22px}.tabs button{background:#151515;color:#fff;border:2px solid #2a2a2a;border-radius:99px;padding:9px 20px;font-weight:800;cursor:pointer;text-transform:uppercase;font-size:13px}.tabs button.on{background:var(--y);color:#000;border-color:var(--y)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0}.row input,.row select{width:auto}.sc{overflow-x:auto}.login{max-width:420px;margin:8vh auto}</style></head><body>
<div class="top"><a href="/"><img src="/logo.png" alt=""></a><span id="who" class="muted"></span></div>
<div class="wrap" id="app"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=(p,b)=>fetch('/api'+p,b?{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)}:{}).then(r=>r.json().then(j=>({ok:r.ok,s:r.status,j})));
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];let tab='bookings';
async function boot(){const r=await api('/me');if(!r.ok||r.j.role!=='admin')return loginView();$('#who').innerHTML=esc(r.j.email)+' · <a href="#" id="lo">Sign out</a>';$('#lo').onclick=async e=>{e.preventDefault();await api('/logout',{});location.reload()};shell()}
function loginView(){$('#app').innerHTML=`<div class="card login"><h1 style="margin:0 0 6px">Admin</h1><p class="muted">Sign in to manage bookings.</p><label>Email</label><input id="e" type="email" autocomplete="username"><label>Password</label><input id="p" type="password" autocomplete="current-password"><div class="err" id="er"></div><button class="btn" id="go" style="width:100%">Sign in</button></div>`;
const go=async()=>{const r=await api('/login',{email:$('#e').value,password:$('#p').value});if(r.ok){if(r.j.role!=='admin'){await api('/logout',{});$('#er').textContent='This account is not an admin.';return}boot()}else $('#er').textContent=r.j.error};$('#go').onclick=go;$('#p').onkeydown=e=>{if(e.key==='Enter')go()}}
function shell(){$('#app').innerHTML=`<h1 style="margin:0;font-size:48px">Dashboard</h1><div class="tabs">${['bookings','availability'].map(t=>`<button data-t="${t}" class="${t===tab?'on':''}">${t}</button>`).join('')}</div><div id="pane"></div>`;document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;shell()});({bookings,availability})[tab]()}
async function bookings(){const r=await api('/admin/bookings');$('#pane').innerHTML=`<div class="card sc"><table><tr><th>Ref</th><th>When (IST)</th><th>Studio</th><th>Guest</th><th>Distribution</th><th>Status</th><th></th></tr>${r.j.map(b=>`<tr><td><b>${esc(b.ref)}</b></td><td>${esc(b.date)}<br>${esc(b.start)}-${esc(b.end)}</td><td>${esc(b.city)}</td><td>${esc(b.name)}<br><span class="muted">${esc(b.email)}<br>${esc(b.phone)}</span><br>${esc(b.topic)}</td><td>${[...JSON.parse(b.channels||'[]'),...JSON.parse(b.press||'[]').map(x=>x+' press')].map(esc).join(', ')}</td><td><span class="tag t-${esc(b.status)}">${esc(b.status)}</span></td><td>${['confirmed','cancelled'].filter(s=>s!==b.status).map(s=>`<button class="btn sm ${s==='cancelled'?'red':''}" data-id="${b.id}" data-s="${s}">${s==='confirmed'?'Confirm':'Cancel'}</button>`).join(' ')}</td></tr>`).join('')||'<tr><td colspan=7 class="muted">No bookings yet.</td></tr>'}</table></div>`;
document.querySelectorAll('[data-s]').forEach(b=>b.onclick=async()=>{await api('/admin/booking-status',{id:b.dataset.id,status:b.dataset.s});bookings()})}
async function availability(){const r=(await api('/admin/studios')).j;const sid=window.__sid||r.studios[0].id;const st=r.studios.find(s=>s.id===sid);const hrs=r.availability.filter(a=>a.studio_id===sid);
$('#pane').innerHTML=`<div class="card"><label>Studio city</label><select id="ss">${r.studios.map(s=>`<option value="${s.id}" ${s.id===sid?'selected':''}>${esc(s.city)}</option>`).join('')}</select>
<h3 style="margin:22px 0 4px">Rules</h3><div class="row"><label style="margin:0">Slot (min)</label><input id="sl" type="number" value="${st.slot_minutes}" style="width:90px"><label style="margin:0">Buffer (min)</label><input id="bf" type="number" value="${st.buffer_minutes}" style="width:90px"><label style="margin:0">Min notice (hours)</label><input id="nt" type="number" value="${st.min_notice_hours}" style="width:90px"><label style="margin:0"><input type="checkbox" id="ac" ${st.active?'checked':''} style="width:auto"> Accepting bookings</label><button class="btn sm" id="sr">Save rules</button></div>
<h3 style="margin:22px 0 4px">Working hours</h3><p class="muted">Leave a day empty for a day off. Add two ranges for a lunch break.</p>
${[1,2,3,4,5,6,0].map(d=>`<div class="row" data-d="${d}"><b style="width:44px">${DOW[d]}</b><span class="rg">${hrs.filter(h=>h.dow===d).map(h=>`<span class="rr"><input type="time" value="${h.start}"> to <input type="time" value="${h.end}"> <a href="#" class="rm">×</a> </span>`).join('')}</span><button class="btn sm ghost add">+ range</button></div>`).join('')}
<div class="row"><button class="btn" id="sh">Save hours</button></div><div class="err" id="er"></div>
<h3 style="margin:22px 0 4px">Blocked dates</h3><div class="row"><input type="date" id="bd"><input id="br" placeholder="Reason (optional)" style="width:220px"><select id="bs"><option value="">All studios</option><option value="${sid}">${esc(st.city)} only</option></select><button class="btn sm" id="ab">Block date</button></div>
${r.blocked.map(b=>`<div class="row"><span>${esc(b.date)}</span><span class="muted">${esc(b.reason)} ${b.studio_id?'('+esc((r.studios.find(s=>s.id===b.studio_id)||{}).city)+')':'(all studios)'}</span><button class="btn sm ghost" data-ub="${b.id}">Remove</button></div>`).join('')}</div>`;
$('#ss').onchange=e=>{window.__sid=+e.target.value;availability()};
const bind=()=>{document.querySelectorAll('.rm').forEach(a=>a.onclick=e=>{e.preventDefault();a.parentElement.remove()})};bind();
document.querySelectorAll('.add').forEach(b=>b.onclick=()=>{const s=document.createElement('span');s.className='rr';s.innerHTML='<input type="time" value="10:00"> to <input type="time" value="18:00"> <a href="#" class="rm">×</a> ';b.parentElement.querySelector('.rg').append(s);bind()});
$('#sr').onclick=async()=>{const x=await api('/admin/studio',{id:sid,slot_minutes:$('#sl').value,buffer_minutes:$('#bf').value,min_notice_hours:$('#nt').value,active:$('#ac').checked});$('#er').textContent=x.ok?'Rules saved.':x.j.error};
$('#sh').onclick=async()=>{const hours=[];document.querySelectorAll('[data-d]').forEach(r=>r.querySelectorAll('.rr').forEach(s=>{const i=s.querySelectorAll('input');hours.push({dow:+r.dataset.d,start:i[0].value,end:i[1].value})}));const x=await api('/admin/hours',{studio_id:sid,hours});$('#er').textContent=x.ok?'Hours saved.':x.j.error};
$('#ab').onclick=async()=>{const x=await api('/admin/block',{date:$('#bd').value,reason:$('#br').value,studio_id:$('#bs').value});x.ok?availability():$('#er').textContent=x.j.error};
document.querySelectorAll('[data-ub]').forEach(b=>b.onclick=async()=>{await api('/admin/unblock',{id:b.dataset.ub});availability()})}
boot();
</script></body></html>
