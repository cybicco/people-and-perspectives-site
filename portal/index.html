<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Client portal | People &amp; Perspectives</title><link rel="icon" href="/favicon.png"><link rel="stylesheet" href="/app.css">
<style>.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 22px}.tabs button{background:#151515;color:#fff;border:2px solid #2a2a2a;border-radius:99px;padding:9px 20px;font-weight:800;cursor:pointer;text-transform:uppercase;font-size:13px}.tabs button.on{background:var(--y);color:#000;border-color:var(--y)}.login{max-width:420px;margin:8vh auto}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sc{overflow-x:auto}.price{font:400 40px Anton,Impact;color:var(--y)}</style></head><body>
<div class="top"><a href="/"><img src="/logo.png" alt=""></a><span id="who" class="muted"></span></div><div class="wrap" id="app"></div>
<script src="https://checkout.razorpay.com/v1/checkout.js" defer></script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=(p,b)=>fetch('/api'+p,b?{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)}:{}).then(r=>r.json().then(j=>({ok:r.ok,s:r.status,j})));
const inr=p=>'₹'+(p/100).toLocaleString('en-IN');let tab='bookings',ME;
async function boot(){const r=await api('/me');if(!r.ok||r.j.role!=='client')return login();ME=r.j;$('#who').innerHTML=esc(r.j.email)+' · <a href="#" id="lo">Sign out</a>';$('#lo').onclick=async e=>{e.preventDefault();await api('/logout',{});location.reload()};ME.must_change?changePw():shell()}
function login(){$('#app').innerHTML=`<div class="card login"><h1 style="margin:0 0 6px">Client portal</h1><p class="muted">Sign in with the login we sent you.</p><label>Email</label><input id="e" type="email" autocomplete="username"><label>Password</label><input id="p" type="password" autocomplete="current-password"><div class="err" id="er"></div><button class="btn" id="go" style="width:100%">Sign in</button></div>`;
const go=async()=>{const r=await api('/login',{email:$('#e').value,password:$('#p').value});if(r.ok){if(r.j.role!=='client'){await api('/logout',{});$('#er').textContent='Please use the admin page for this account.';return}boot()}else $('#er').textContent=r.j.error};$('#go').onclick=go;$('#p').onkeydown=e=>{if(e.key==='Enter')go()}}
function changePw(){$('#app').innerHTML=`<div class="card login"><h1 style="margin:0 0 6px">Set a new password</h1><p class="muted">Choose a new password (at least 10 characters) to continue.</p><label>Temporary password</label><input id="c" type="password" autocomplete="current-password"><label>New password</label><input id="n" type="password" autocomplete="new-password"><div class="err" id="er"></div><button class="btn" id="go" style="width:100%">Save password</button></div>`;$('#go').onclick=async()=>{const r=await api('/password',{current:$('#c').value,new:$('#n').value});r.ok?boot():$('#er').textContent=r.j.error}}
function shell(){$('#app').innerHTML=`<h1 style="margin:0;font-size:48px">Your dashboard</h1><div class="tabs">${[['bookings','My bookings'],['offers','Offers & deliverables'],['payments','Payment history'],['rate','Rate your studio'],['testimonial','Share a testimonial']].map(t=>`<button data-t="${t[0]}" class="${t[0]===tab?'on':''}">${t[1]}</button>`).join('')}</div><div id="pane"></div>`;document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;shell()});({bookings,offers,payments,rate,testimonial})[tab]()}
const BL={approved:'Approved: ready to finalise',requested:'Waiting for team approval',confirmed:'Confirmed',inquiry:'Inquiry under review',declined:'Declined',cancelled:'Cancelled'};
const stTag=s=>`<span class="tag t-${s==='paid'||s==='delivered'?'confirmed':s==='cancelled'?'cancelled':'pending'}">${esc(s)}</span>`;

async function bookings(){const [r,sts]=await Promise.all([api('/client/bookings'),api('/studios')]);const L=r.j.bookings||[];window.__sts=sts.j;$('#pane').innerHTML=L.map(b=>`<div class="card" style="margin-bottom:16px"><div class="row" style="justify-content:space-between"><h2 style="margin:0">${esc(b.city)} studio · ${esc(b.ref)}</h2><span class="tag t-${esc(b.status)}">${esc(BL[b.status]||b.status)}</span></div><p>${esc(b.date)} at ${esc(b.start)} IST</p><p class="muted">${[...JSON.parse(b.channels||'[]'),...JSON.parse(b.press||'[]').map(x=>x+' press')].map(esc).join(', ')}</p>${['approved','requested'].includes(b.status)?`<button class="btn" data-fin="${b.id}">${b.status==='approved'?'Finalise booking':'Change details'}</button><div data-box="${b.id}"></div>`:''}</div>`).join('')||'<div class="card muted">No bookings linked to your login yet.</div>';
document.querySelectorAll('[data-fin]').forEach(btn=>btn.onclick=()=>fin(+btn.dataset.fin,L.find(x=>x.id===+btn.dataset.fin)))}
function fin(id,b){const box=document.querySelector(`[data-box="${id}"]`);const VID=['ANI','ABP','Hindustan Times','Zee','Clipping network'],PR=['ANI','Zee5','Forbes'];const ch=new Set(JSON.parse(b.channels||'[]')),pr=new Set(JSON.parse(b.press||'[]'));let slot=null;
box.innerHTML=`<div class="grid g2"><div><label>Studio</label><select id="fs">${window.__sts.map(s=>`<option value="${s.id}" ${s.id===b.studio_id?'selected':''}>${esc(s.city)}</option>`).join('')}</select></div><div><label>Date</label><input id="fd" type="date" value="${esc(b.date)}"></div></div><label>Time (IST)</label><div id="fl"></div><label>Video distribution</label><div>${VID.map(x=>`<span class="chip ${ch.has(x)?'on':''}" data-c="${x}">${x}</span>`).join('')}</div><label>Press release sites</label><div>${PR.map(x=>`<span class="chip ${pr.has(x)?'on':''}" data-p="${x}">${x}</span>`).join('')}</div><div class="err" id="fe"></div><button class="btn" id="fg" style="margin-top:12px" disabled>Submit for approval</button>`;
box.querySelectorAll('[data-c]').forEach(e=>e.onclick=()=>{ch.has(e.dataset.c)?ch.delete(e.dataset.c):ch.add(e.dataset.c);e.classList.toggle('on')});box.querySelectorAll('[data-p]').forEach(e=>e.onclick=()=>{pr.has(e.dataset.p)?pr.delete(e.dataset.p):pr.add(e.dataset.p);e.classList.toggle('on')});
const load=async()=>{slot=null;$('#fg').disabled=true;const x=await api(`/slots?studio=${$('#fs').value}&date=${$('#fd').value}`);$('#fl').innerHTML=x.j.length?x.j.map(s=>`<span class="chip" data-t="${s.start}">${s.start}</span>`).join(''):'<span class="muted">No slots that day.</span>';$('#fl').querySelectorAll('[data-t]').forEach(e=>e.onclick=()=>{slot=e.dataset.t;$('#fl').querySelectorAll('.chip').forEach(z=>z.classList.remove('on'));e.classList.add('on');$('#fg').disabled=false})};
$('#fs').onchange=load;$('#fd').onchange=load;load();
$('#fg').onclick=async()=>{const x=await api('/client/finalise',{id,studio_id:$('#fs').value,date:$('#fd').value,start:slot,channels:[...ch],press:[...pr]});x.ok?bookings():$('#fe').textContent=x.j.error}}
async function offers(){const r=await api('/client/offers');const o=r.j.offers||[];$('#pane').innerHTML=o.map(x=>`<div class="card" style="margin-bottom:16px"><div class="row" style="justify-content:space-between"><h2 style="margin:0">${esc(x.title)}</h2>${stTag(x.status)}</div><div class="price">${inr(x.amount_paise)}</div><p>${esc(x.description)}</p>${x.bref?`<p class="muted">Booking ${esc(x.bref)}: ${esc(x.bdate)} ${esc(x.bstart)} IST</p>`:''}${x.status==='sent'?`<button class="btn" data-pay="${x.id}">Pay now</button>`:''}${x.status==='paid'?'<h3 style="margin:14px 0 6px">Deliverables</h3>'+(x.deliverables.map(d=>`<div class="row"><span style="flex:1">${esc(d.title)} ${d.url?`<a href="${esc(d.url)}" target="_blank" rel="noopener">Open</a>`:''}</span>${stTag(d.status)}</div>`).join('')||'<span class="muted">Your deliverables will appear here.</span>'):''}</div>`).join('')||'<div class="card muted">No offers yet. Your offer will appear here once we send it.</div>';
document.querySelectorAll('[data-pay]').forEach(b=>b.onclick=async()=>{b.disabled=true;const id=+b.dataset.pay;const p=await api('/client/pay',{offer_id:id});if(!p.ok){alert(p.j.error);b.disabled=false;return}
const rz=new Razorpay({key:p.j.key,order_id:p.j.order_id,amount:p.j.amount,currency:p.j.currency,name:p.j.name,description:p.j.description,prefill:p.j.prefill,theme:{color:'#FFEA00'},handler:async res=>{const v=await api('/client/verify',{offer_id:id,...res});alert(v.ok?'Payment received. Thank you!':v.j.error);offers()},modal:{ondismiss:()=>{b.disabled=false}}});rz.open()})}
async function payments(){const r=await api('/client/offers');const o=r.j.offers||[];const rows=o.flatMap(x=>x.payments.map(p=>({...p,x})));$('#pane').innerHTML=`<div class="card sc"><table><tr><th>Invoice</th><th>Offer</th><th>Amount</th><th>Status</th><th>Date</th><th></th></tr>${o.map(x=>{const p=x.payments.find(q=>q.status==='paid');return `<tr><td>${esc(x.invoice_no)}</td><td>${esc(x.title)}</td><td>${inr(x.amount_paise)}</td><td>${stTag(p?'paid':x.status==='cancelled'?'cancelled':'due')}</td><td>${esc(p?p.paid_at:'')}</td><td><a href="/api/client/invoice?offer_id=${x.id}" target="_blank" rel="noopener">Invoice</a></td></tr>`}).join('')||'<tr><td colspan=6 class="muted">No invoices yet.</td></tr>'}</table></div>`}
async function rate(){const r=await api('/client/reviewable');const L=r.j||[];$('#pane').innerHTML=L.map(b=>`<div class="card" style="margin-bottom:16px"><b style="font-size:18px">${esc(b.studio)}</b> <span class="muted">${esc(b.city)} · ${esc(b.date)} · ${esc(b.ref)}</span><div class="row" id="st${b.id}" style="font-size:32px;cursor:pointer;color:var(--y)">${[1,2,3,4,5].map(n=>`<span data-n="${n}" data-b="${b.id}">${n<=(b.rating||0)?'★':'☆'}</span>`).join('')}</div><textarea id="fb${b.id}" rows="2" placeholder="How was your experience at this studio?">${esc(b.feedback||'')}</textarea><div class="err" id="er${b.id}"></div><button class="btn sm" data-s="${b.id}">${b.rating?'Update rating':'Submit rating'}</button></div>`).join('')||'<div class="card muted">After your session at a partner studio, you can rate it here.</div>';
const val={};L.forEach(b=>val[b.id]=b.rating||0);document.querySelectorAll('[data-n]').forEach(s=>s.onclick=()=>{const id=s.dataset.b,n=+s.dataset.n;val[id]=n;document.querySelectorAll(`#st${id} span`).forEach((x,i)=>x.textContent=i<n?'★':'☆')});
document.querySelectorAll('[data-s]').forEach(b=>b.onclick=async()=>{const id=b.dataset.s;const x=await api('/client/review',{booking_id:id,rating:val[id],feedback:$('#fb'+id).value});x.ok?rate():$('#er'+id).textContent=x.j.error})}
function testimonial(){$('#pane').innerHTML=`<div class="card"><p class="muted">Tell others about your experience. We review every testimonial before it is shown on the site.</p><label>Your name</label><input id="a" value="${esc(ME.name||'')}"><label>Role / company (optional)</label><input id="r"><label>Your testimonial</label><textarea id="b" rows="5"></textarea><div class="err" id="er"></div><button class="btn" id="go">Submit for review</button></div>`;$('#go').onclick=async()=>{const x=await api('/client/testimonial',{author:$('#a').value,role:$('#r').value,body:$('#b').value});$('#er').style.color=x.ok?'#2BD66B':'';$('#er').textContent=x.ok?'Thank you! We will review it shortly.':x.j.error;if(x.ok)$('#b').value=''}}
boot();
</script></body></html>
