<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book your slot | People &amp; Perspectives</title><link rel="icon" href="/favicon.png"><link rel="stylesheet" href="/app.css">
<style>.steps{display:flex;gap:8px;margin:18px 0 28px}.steps i{flex:1;height:6px;border-radius:9px;background:#262626;transition:.4s}.steps i.on{background:var(--y)}
.city{cursor:pointer;text-align:center;padding:26px 10px;transition:.25s;font-family:Anton,Impact;font-size:22px;text-transform:uppercase}.city:hover,.city.on{background:var(--y);color:#000;border-color:var(--y);transform:translateY(-4px) rotate(-1deg)}
.days{display:flex;gap:10px;overflow-x:auto;padding:4px 0 12px}.day{min-width:68px;text-align:center;border:2px solid #333;border-radius:16px;padding:10px 6px;cursor:pointer;font-weight:700}.day small{display:block;color:#999;font-weight:600}.day.on{background:var(--y);color:#000;border-color:var(--y)}.day.on small{color:#333}
.slot{padding:12px;border:2px solid #333;border-radius:12px;text-align:center;cursor:pointer;font-weight:800}.slot:hover,.slot.on{background:var(--y);color:#000;border-color:var(--y)}
.pane{animation:in .4s both}@keyframes in{from{opacity:0;transform:translateY(16px)}}</style></head><body>
<div class="top"><a href="/"><img src="/logo.png" alt="People &amp; Perspectives"></a><a class="b" href="/">← Back to site</a></div>
<div class="wrap"><h1 style="font-size:clamp(40px,8vw,72px);margin:0">Book your slot</h1><p class="muted">Pick a studio, choose how your episode goes out, and reserve a time.</p>
<div class="steps"><i></i><i></i><i></i><i></i></div><div id="v"></div></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S={step:0,studio:null,date:null,slot:null,channels:new Set(),press:new Set()};
const VID=['ANI','ABP','Hindustan Times','Zee'],PR=['ANI','Zee5','Forbes'];
const api=(p,o)=>fetch('/api'+p,o).then(r=>r.json().then(j=>({ok:r.ok,j})));
function bar(){document.querySelectorAll('.steps i').forEach((e,i)=>e.classList.toggle('on',i<=S.step))}
async function render(){bar();const v=$('#v');
if(S.step===0){const r=await api('/studios');v.innerHTML='<div class="pane"><h2>1. Choose your studio city</h2><div class="grid g5">'+r.j.map(s=>`<div class="card city ${S.studio&&S.studio.id===s.id?'on':''}" data-id="${s.id}" data-c="${esc(s.city)}">${esc(s.city)}</div>`).join('')+'</div></div>';
v.querySelectorAll('.city').forEach(e=>e.onclick=()=>{S.studio={id:+e.dataset.id,city:e.dataset.c};S.step=1;render()})}
else if(S.step===1){v.innerHTML=`<div class="pane"><h2>2. Distribution</h2><label>Video distribution (pick any)</label><div>${VID.map(x=>`<span class="chip ${S.channels.has(x)?'on':''}" data-k="c" data-v="${x}">${x}</span>`).join('')}</div><label>Press release sites</label><div>${PR.map(x=>`<span class="chip ${S.press.has(x)?'on':''}" data-k="p" data-v="${x}">${x}</span>`).join('')}</div><label>Extras</label><div><span class="chip ${S.channels.has('Clipping network')?'on':''}" data-k="c" data-v="Clipping network">Clipping network (optional)</span></div><p class="muted">Audio on Apple Podcasts, Spotify and more, plus social amplification, is part of every episode.</p><p><button class="btn ghost" id="bk">Back</button> <button class="btn" id="nx">Continue</button></p></div>`;
v.querySelectorAll('.chip').forEach(e=>e.onclick=()=>{const t=e.dataset.k==='c'?S.channels:S.press;t.has(e.dataset.v)?t.delete(e.dataset.v):t.add(e.dataset.v);e.classList.toggle('on')});
$('#bk').onclick=()=>{S.step=0;render()};$('#nx').onclick=()=>{S.step=2;render()}}
else if(S.step===2){const ds=[];const n=new Date();for(let i=1;i<=30;i++){const d=new Date(n.getTime()+i*864e5);ds.push(d)}
const iso=d=>new Date(d.getTime()+19800000).toISOString().slice(0,10);
v.innerHTML=`<div class="pane"><h2>3. Pick a date and time <small class="muted">(IST)</small></h2><div class="days">${ds.map(d=>`<div class="day ${S.date===iso(d)?'on':''}" data-d="${iso(d)}"><small>${d.toLocaleDateString('en-IN',{weekday:'short'})}</small>${d.getDate()}<small>${d.toLocaleDateString('en-IN',{month:'short'})}</small></div>`).join('')}</div><div id="sl" class="grid g5" style="margin-top:10px"></div><p><button class="btn ghost" id="bk">Back</button> <button class="btn" id="nx" disabled>Continue</button></p></div>`;
const load=async()=>{if(!S.date){$('#sl').innerHTML='<p class="muted">Select a date.</p>';return}const r=await api(`/slots?studio=${S.studio.id}&date=${S.date}`);$('#sl').innerHTML=r.j.length?r.j.map(s=>`<div class="slot ${S.slot&&S.slot.start===s.start?'on':''}" data-s="${s.start}" data-e="${s.end}">${s.start}</div>`).join(''):'<p class="muted">No open slots that day. Try another date.</p>';
$('#sl').querySelectorAll('.slot').forEach(e=>e.onclick=()=>{S.slot={start:e.dataset.s,end:e.dataset.e};$('#sl').querySelectorAll('.slot').forEach(x=>x.classList.remove('on'));e.classList.add('on');$('#nx').disabled=false})};
v.querySelectorAll('.day').forEach(e=>e.onclick=()=>{S.date=e.dataset.d;S.slot=null;v.querySelectorAll('.day').forEach(x=>x.classList.remove('on'));e.classList.add('on');load()});load();
$('#bk').onclick=()=>{S.step=1;render()};$('#nx').onclick=()=>{S.step=3;render()}}
else if(S.step===3){v.innerHTML=`<div class="pane"><h2>4. Your details</h2><div class="card" style="margin-bottom:14px"><b>${esc(S.studio.city)}</b> studio, ${esc(S.date)} at ${esc(S.slot.start)} IST<br><span class="muted">${[...S.channels,...[...S.press].map(x=>x+' press')].map(esc).join(', ')||'No distribution selected yet'}</span></div>
<label>Full name</label><input id="n" autocomplete="name"><label>Email</label><input id="e" type="email" autocomplete="email"><label>Phone / WhatsApp</label><input id="p" type="tel" autocomplete="tel"><label>What is your story about?</label><textarea id="t" rows="4"></textarea><div class="err" id="er"></div><p><button class="btn ghost" id="bk">Back</button> <button class="btn" id="nx">Confirm booking</button></p></div>`;
$('#bk').onclick=()=>{S.step=2;render()};$('#nx').onclick=async()=>{const b=$('#nx');b.disabled=true;const r=await api('/book',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({studio_id:S.studio.id,date:S.date,start:S.slot.start,name:$('#n').value,email:$('#e').value,phone:$('#p').value,topic:$('#t').value,channels:[...S.channels],press:[...S.press]})});
if(r.ok){S.ref=r.j.ref;S.step=4;render()}else{$('#er').textContent=r.j.error||'Something went wrong.';b.disabled=false;if(r.status===409){}}}}
else{bar();document.querySelectorAll('.steps i').forEach(i=>i.classList.add('on'));v.innerHTML=`<div class="pane card" style="text-align:center;padding:50px 20px"><div style="font-size:64px">🎙️</div><h2>You're booked in</h2><p>Reference <b class="an" style="font-size:28px;color:var(--y)">${esc(S.ref)}</b></p><p>${esc(S.studio.city)} studio, ${esc(S.date)} at ${esc(S.slot.start)} IST.</p><p class="muted">Our team will review your request and send your offer and next steps.</p><a class="btn" href="/">Back to site</a></div>`}}
render();
</script></body></html>
