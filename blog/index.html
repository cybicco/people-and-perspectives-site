<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blog | People &amp; Perspectives</title><meta name="description" content="Stories, guides and news from People &amp; Perspectives."><link rel="icon" href="/favicon.png"><link rel="stylesheet" href="/app.css"></head><body>
<div class="top"><a href="/"><img src="/logo.png" alt=""></a><a class="b" href="/">← Back to site</a></div><div class="wrap" id="v"></div>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const OK={P:[],H2:[],H3:[],H4:[],STRONG:[],B:[],EM:[],I:[],U:[],UL:[],OL:[],LI:[],BLOCKQUOTE:[],BR:[],HR:[],A:['href'],IMG:['src','alt'],DIV:[],SPAN:[],FIGURE:[],FIGCAPTION:[],PRE:[],CODE:[]};
function clean(html){const d=new DOMParser().parseFromString('<body>'+html,'text/html').body;(function w(n){[...n.childNodes].forEach(c=>{if(c.nodeType===3)return;if(c.nodeType!==1){c.remove();return}const t=c.tagName,al=OK[t];if(!al){c.replaceWith(...c.childNodes);return}[...c.attributes].forEach(a=>{if(!al.includes(a.name))c.removeAttribute(a.name)});
 if(t==='A'){const h=c.getAttribute('href')||'';if(!/^(https?:|mailto:|\/)/.test(h))c.removeAttribute('href');else{c.setAttribute('rel','noopener noreferrer');if(/^https?:/.test(h))c.setAttribute('target','_blank')}}
 if(t==='IMG'){const s=c.getAttribute('src')||'';if(!/^(https:|\/)/.test(s)){c.remove();return}c.setAttribute('loading','lazy')}
 w(c)})})(d);return d.innerHTML}
const q=new URLSearchParams(location.search),s=q.get('s'),cat=q.get('c');
const dt=x=>new Date((x||'').replace(' ','T')+(x&&x.length>16?'Z':'')).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
(async()=>{const v=document.getElementById('v');
if(!s){const r=await (await fetch('/api/blogs')).json();const cats=[...new Set(r.map(b=>b.category).filter(Boolean))];const L=r.filter(b=>!cat||b.category===cat);const feat=!cat&&L.find(b=>b.featured);
 const card=b=>`<a href="/blog/?s=${encodeURIComponent(b.slug)}" style="text-decoration:none;color:#fff"><div class="card" style="height:100%">${b.cover?`<img src="${esc(b.cover)}" alt="" style="width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:12px;margin-bottom:10px">`:''}<div class="muted" style="font-size:13px">${esc(b.category||'')} ${b.category?'·':''} ${b.rt} min read</div><h3 style="margin:4px 0">${esc(b.title)}</h3><p class="muted" style="margin:0">${esc(b.excerpt||'')}</p></div></a>`;
 v.innerHTML='<h1 style="font-size:clamp(40px,8vw,72px);margin:0 0 14px">Blog</h1>'+(cats.length?`<div style="margin-bottom:18px"><a class="chip ${cat?'':'on'}" href="/blog/" style="text-decoration:none;color:inherit">All</a>${cats.map(c=>`<a class="chip ${cat===c?'on':''}" href="/blog/?c=${encodeURIComponent(c)}" style="text-decoration:none;color:inherit">${esc(c)}</a>`).join('')}</div>`:'')+(feat?`<div style="margin-bottom:18px">${card(feat)}</div>`:'')+'<div class="grid g3">'+(L.filter(b=>b!==feat).map(card).join('')||(feat?'':'<p class="muted">New posts are coming soon.</p>'))+'</div>';return}
const r=await fetch('/api/blog?slug='+encodeURIComponent(s));if(!r.ok){v.innerHTML='<h1>Not found</h1><a class="btn" href="/blog/">All posts</a>';return}const b=await r.json();document.title=b.title+' | People & Perspectives';
if(b.seo_desc||b.excerpt){let m=document.querySelector('meta[name=description]');m.content=b.seo_desc||b.excerpt}
const tags=(b.tags||'').split(',').map(x=>x.trim()).filter(Boolean);
v.innerHTML=`<a href="/blog/" class="muted" style="text-decoration:none">← All posts</a><div class="muted" style="margin-top:14px">${esc(b.category||'')} ${b.category?'·':''} ${esc(dt(b.publish_at||b.created_at))} · ${b.rt} min read${b.author?' · by '+esc(b.author):''}</div><h1 style="font-size:clamp(36px,7vw,64px);margin:6px 0 14px">${esc(b.title)}</h1>${b.cover?`<img src="${esc(b.cover)}" alt="" style="width:100%;border-radius:16px;margin-bottom:20px">`:''}<div class="post">${clean(b.body||'')}</div>${tags.length?`<div style="margin-top:24px">${tags.map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div>`:''}`})();
</script></body></html>
