<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blog | People &amp; Perspectives</title><link rel="icon" href="/favicon.png"><link rel="stylesheet" href="/app.css"></head><body>
<div class="top"><a href="/"><img src="/logo.png" alt=""></a><a class="b" href="/">← Back to site</a></div><div class="wrap" id="v"></div>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const s=new URLSearchParams(location.search).get('s');
(async()=>{const v=document.getElementById('v');if(!s){const r=await (await fetch('/api/blogs')).json();v.innerHTML='<h1 style="font-size:clamp(40px,8vw,72px);margin:0 0 20px">Blog</h1><div class="grid g3">'+(r.map(b=>`<a href="/blog/?s=${encodeURIComponent(b.slug)}" style="text-decoration:none;color:#fff"><div class="card">${b.cover?`<img src="${esc(b.cover)}" alt="" style="width:100%;border-radius:12px;margin-bottom:10px">`:''}<h3 style="margin:0">${esc(b.title)}</h3><p class="muted">${esc(b.excerpt)}</p></div></a>`).join('')||'<p class="muted">New stories coming soon.</p>')+'</div>';return}
const r=await fetch('/api/blog?slug='+encodeURIComponent(s));if(!r.ok){v.innerHTML='<h1>Not found</h1>';return}const b=await r.json();document.title=b.title+' | People & Perspectives';v.innerHTML=`<h1 style="font-size:clamp(36px,7vw,64px);margin:0 0 14px">${esc(b.title)}</h1>${b.cover?`<img src="${esc(b.cover)}" alt="" style="width:100%;border-radius:16px;margin-bottom:20px">`:''}${b.body.split(/\n\s*\n/).map(p=>`<p style="font-size:18px;line-height:1.7">${esc(p).replace(/\n/g,'<br>')}</p>`).join('')}`})();
</script></body></html>
