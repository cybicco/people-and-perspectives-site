<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Become a studio partner | People &amp; Perspectives</title><link rel="icon" href="/favicon.png"><link rel="stylesheet" href="/app.css"><style>.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 22px}.tabs button{background:#151515;color:#fff;border:2px solid #2a2a2a;border-radius:99px;padding:9px 20px;font-weight:800;cursor:pointer;text-transform:uppercase;font-size:13px}.tabs button.on{background:var(--y);color:#000;border-color:var(--y)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0}.row input,.row select{width:auto}.sc{overflow-x:auto}.login{max-width:420px;margin:8vh auto}.hp{position:absolute;left:-9999px}</style></head><body><div class="top"><a href="/"><img src="/logo.png" alt=""></a><a class="b" href="/">← Back to site</a></div><div class="wrap" id="app"><h1 style="margin:0;font-size:clamp(40px,8vw,64px)">Apply to become a studio partner</h1><p class="muted" style="font-size:18px">Own a podcast or video studio? Tell us about it. Our team reviews every application and will contact you.</p>
<form id="f" class="card" autocomplete="on"><input class="hp" name="website2" id="hp" tabindex="-1" autocomplete="off">
<div class="grid g2"><div><label>Studio name *</label><input id="studio_name" required></div><div><label>Contact person *</label><input id="contact_name" required></div><div><label>Email *</label><input id="email" type="email" required></div><div><label>Phone *</label><input id="phone" type="tel" required></div><div><label>City *</label><input id="city" required></div><div><label>Years operating</label><input id="years"></div></div>
<label>Full address *</label><textarea id="address" rows="2" required></textarea>
<div class="grid g2"><div><label>Registration number (GST / company / udyam) *</label><input id="registration_no" required></div><div><label>Registration type</label><select id="registration_type"><option value="">Select</option><option>GST</option><option>Company / LLP</option><option>MSME / Udyam</option><option>Shop &amp; establishment</option><option>Other</option></select></div></div>
<label>Studio setup and equipment</label><textarea id="setup" rows="3" placeholder="Cameras, mics, lights, sets, capacity, number of rooms..."></textarea>
<label>Website or social link</label><input id="website" placeholder="https://">
<label>Links to previous shoots (one per line, https://)</label><textarea id="shoot_links" rows="3"></textarea>
<div class="grid g2"><div><label>Studio photos * (up to 4)</label><input type="file" id="photos" accept="image/*" multiple></div><div><label>Registration certificate * (PDF or photo, under 1 MB)</label><input type="file" id="cert" accept="image/*,application/pdf"></div></div>
<label>Anything else we should know</label><textarea id="about" rows="3"></textarea>
<label style="display:flex;gap:10px;align-items:flex-start;text-transform:none;font-weight:500"><input type="checkbox" id="consent" style="width:auto;margin-top:4px"> I confirm the details are correct and agree that People &amp; Perspectives may contact me and review the documents I upload.</label>
<div class="err" id="er"></div><button class="btn" id="go" type="submit">Submit application</button></form></div>
<script src="/dash.js"></script><script>
const {$,api,file}=D;$('#f').onsubmit=async e=>{e.preventDefault();const er=$('#er');er.textContent='';$('#go').disabled=true;
try{const ph=[...$('#photos').files].slice(0,4);if(!ph.length)throw new Error('Please upload at least one studio photo.');if(!$('#cert').files[0])throw new Error('Please upload your registration certificate.');
const photos=[];for(const f of ph)photos.push(await file(f,1280,.78));const certificate=await file($('#cert').files[0],1600,.8);
const b={kind:'studio',hp:$('#hp').value,consent:$('#consent').checked,photos,certificate,shoot_links:$('#shoot_links').value.split(/\s+/).filter(Boolean)};
for(const k of['studio_name','contact_name','email','phone','city','years','address','registration_no','registration_type','setup','website','about'])b[k]=$('#'+k).value;
const r=await api('/apply',b);if(!r.ok)throw new Error(r.j.error||'Something went wrong.');
$('#app').innerHTML='<div class="card" style="margin-top:40px"><h1 style="margin:0 0 10px">Application received</h1><p style="font-size:18px">Thank you. Our team will review your studio and get back to you. Your reference is <b>'+D.esc(r.j.ref)+'</b>.</p><a class="btn" href="/">Back to site</a></div>'
}catch(x){er.textContent=x.message;$('#go').disabled=false}}
</script></body></html>
