<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Studio dashboard | People &amp; Perspectives</title><link rel="icon" href="/favicon.png"><link rel="stylesheet" href="/app.css"><style>.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 22px}.tabs button{background:#151515;color:#fff;border:2px solid #2a2a2a;border-radius:99px;padding:9px 20px;font-weight:800;cursor:pointer;text-transform:uppercase;font-size:13px}.tabs button.on{background:var(--y);color:#000;border-color:var(--y)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0}.row input,.row select{width:auto}.sc{overflow-x:auto}.login{max-width:420px;margin:8vh auto}.hp{position:absolute;left:-9999px}</style></head><body><div class="top"><a href="/"><img src="/logo.png" alt=""></a><span id="who" class="muted"></span></div><div class="wrap" id="app"></div><script src="/dash.js"></script><script>
const {$,esc,api,stars}=D;let DB;
D.start('studio','Studio dashboard',async me=>{await load()});
async function load(){const r=await api('/studio/dashboard');DB=r.j;const p=DB.profile||{};const up=DB.bookings.filter(b=>b.date>=DB.today),past=DB.bookings.filter(b=>b.date<DB.today);
$('#app').innerHTML=`<h1 style="margin:0;font-size:44px">${esc(p.name||'Your studio')}</h1><p class="muted">${esc(p.city||'')} ${DB.avg?'· Client rating <b style="color:var(--y)">'+DB.avg+' / 5</b> ('+DB.reviews.length+')':'· No client ratings yet'}</p>
<h2 style="margin:24px 0 8px">Upcoming sessions</h2>${up.map(card).join('')||'<div class="card muted">No upcoming sessions assigned to you yet.</div>'}
<h2 style="margin:24px 0 8px">Past sessions and deliverables</h2>${past.map(card).join('')||'<div class="card muted">Nothing here yet.</div>'}
<h2 style="margin:24px 0 8px">Client feedback</h2>${DB.reviews.map(x=>`<div class="card" style="margin-bottom:10px"><span style="color:var(--y);font-size:20px">${stars(x.rating)}</span> <span class="muted">${esc(x.date)} · ${esc(x.ref)}</span><p style="margin:6px 0 0">${esc(x.feedback||'')}</p></div>`).join('')||'<div class="card muted">No feedback yet.</div>'}`;
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=async()=>{const id=b.dataset.add;const g=s=>document.querySelector(`[data-f="${s}-${id}"]`).value;const x=await api('/studio/deliverable',{booking_id:id,title:g('t'),url:g('u'),status:g('s')});x.ok?load():alert(x.j.error)});
document.querySelectorAll('[data-up]').forEach(s=>s.onchange=async()=>{const d=JSON.parse(s.dataset.up);const x=await api('/studio/deliverable',{booking_id:d.b,id:d.id,title:d.t,url:d.u,status:s.value});x.ok||alert(x.j.error)});
document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(confirm('Remove this deliverable?')){await api('/studio/deliverable-delete',{id:b.dataset.del});load()}})}
function card(b){return `<div class="card" style="margin-bottom:14px"><div class="row" style="justify-content:space-between"><b style="font-size:18px">${esc(b.date)} · ${esc(b.start)}-${esc(b.end)} · ${esc(b.city)}</b><span class="tag t-${b.status==='confirmed'?'confirmed':'requested'}">${esc(b.status)}</span></div><div>${esc(b.name)} <span class="muted">${esc(b.email)} · ${esc(b.phone)}</span></div><div class="muted">${esc(b.topic||'')}</div><div class="muted">Ref ${esc(b.ref)}</div>
<h3 style="margin:14px 0 6px;font-size:18px">Deliverables</h3>${b.offer_id?'':'<p class="muted">No offer is linked to this booking yet. The team will link it before you can add deliverables.</p>'}${b.deliverables.map(d=>`<div class="row"><span style="flex:1">${esc(d.title)} ${d.url?`<a href="${esc(d.url)}" target="_blank" rel="noopener">open</a>`:''}</span><select data-up='${esc(JSON.stringify({b:b.id,id:d.id,t:d.title,u:d.url||''}))}'>${['pending','in_progress','delivered'].map(s=>`<option ${s===d.status?'selected':''}>${s}</option>`).join('')}</select><button class="btn sm red" data-del="${d.id}">×</button></div>`).join('')}
${b.offer_id?`<div class="row"><input data-f="t-${b.id}" placeholder="Deliverable title (e.g. Full episode)" style="flex:1;min-width:160px"><input data-f="u-${b.id}" placeholder="https:// link (Drive, YouTube...)" style="flex:1;min-width:160px"><select data-f="s-${b.id}"><option>pending</option><option>in_progress</option><option selected>delivered</option></select><button class="btn sm" data-add="${b.id}">Add</button></div>`:''}</div>`}
</script></body></html>
